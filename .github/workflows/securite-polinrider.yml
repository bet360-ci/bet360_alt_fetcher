# Analyse anti-malware PolinRider/BeaverTail — AUTONOME, et c'est delibere.
#
# Les 43 autres depots de l'org appellent le workflow reutilisable de
# bet360-ci/run_book. Ici c'est IMPOSSIBLE : ce depot est PUBLIC et run_book est
# PRIVE — GitHub interdit a un depot public d'appeler un workflow d'un depot
# prive. Resultat mesure le 2026-09-26 : trois `failure` d'affilee en
# `startup_failure`, sans aucun job et sans journal (« log not found »). La porte
# paraissait posee et ne gardait rien depuis le 2026-09-25.
#
# C'est aussi le SEUL des 44 depots que le ruleset de push de l'org ne peut pas
# couvrir : « Source public repos cannot have push rules » (HTTP 422).
#
# PIEGE D'ECRITURE, rencontre sur ce fichier meme : dans un bloc `run: |`, toute
# ligne de continuation doit rester INDENTEE. Une liste de motifs ecrite en
# colonne 0 termine le bloc, le YAML devient invalide, et GitHub rend un
# `startup_failure` sans job ni journal — en affichant le CHEMIN du fichier au
# lieu du `name:`. D'ou les motifs en arguments de `for`, sur une seule ligne.
name: securite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  polinrider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `grep -F` (chaines litterales) et JAMAIS une regex bricolee : un
      # echappement invalide fait sortir grep en code 2 et n'examine RIEN, en
      # silence. Ce piege a deja masque de vrais resultats.
      # Limite a *.js et *.json : ce fichier-ci cite les motifs, il ne doit pas
      # se detecter lui-meme.
      - name: Signatures PolinRider dans le bundle
        run: |
          set -u
          TROUVE=0
          for M in "global['!']=" 'global.i="A9-' "global['_V']" 'atob(process.env' 'createRequire(import.meta.url)'; do
            if grep -rlF -- "$M" --include='*.js' --include='*.json' . 2>/dev/null | grep -q .; then
              echo "::error::signature PolinRider trouvee : $M"
              grep -rlF -- "$M" --include='*.js' --include='*.json' . 2>/dev/null
              TROUVE=1
            fi
          done
          [ "$TROUVE" -eq 0 ] || exit 1
          echo "aucune signature de contenu"

      # Le camouflage : la charge est collee en FIN DE LIGNE apres ~149 espaces,
      # parfois AU MILIEU du fichier. Un bundle minifie n'a aucune raison de
      # porter 150 espaces consecutifs suivis de code.
      - name: Bloc de 150+ espaces suivi de code
        run: |
          set -u
          if grep -rnE ' {150,}[^ ]' --include='*.js' --include='*.json' . 2>/dev/null | grep -q .; then
            echo "::error::bloc de 150+ espaces suivi de code — camouflage PolinRider"
            grep -rnE ' {150,}[^ ]' --include='*.js' --include='*.json' . 2>/dev/null | cut -c1-160
            exit 1
          fi
          echo "aucun bloc d'espaces suspect"

      # Aucune installation FontAwesome legitime n'existe dans l'org : tout
      # repertoire */fonts/fa-* est malveillant par construction. `.vscode/` est
      # le vecteur d'auto-execution (tasks.json + runOn: folderOpen).
      - name: Chemins interdits (fausses polices, .vscode)
        run: |
          set -u
          H=$(find . -path ./.git -prune -o \( -path '*/fonts/fa-*' -o -path '*/.vscode/*' \) -print 2>/dev/null)
          if [ -n "$H" ]; then
            echo "::error::chemin interdit present"
            echo "$H"
            exit 1
          fi
          echo "aucun chemin interdit"

      # Le controle le plus utile ici : ce depot est un ARTEFACT DE PUBLICATION,
      # pas un projet. Il ne doit contenir que le bundle, son manifeste et les
      # deux fichiers de garde. Tout ajout est suspect par construction.
      - name: Le depot ne contient que ses quatre fichiers
        run: |
          set -u
          REEL=$(find . -path ./.git -prune -o -type f -print 2>/dev/null | sort | tr '\n' ' ')
          ATTENDU='./.github/workflows/securite-polinrider.yml ./.githooks/pre-commit ./index.js ./package.json '
          if [ "$REEL" != "$ATTENDU" ]; then
            echo "::error::contenu inattendu dans le depot publie"
            echo "attendu : $ATTENDU"
            echo "reel    : $REEL"
            exit 1
          fi
          echo "contenu conforme"
